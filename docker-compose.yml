name: shopeasy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shopeasy-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Uncomment to reach Postgres from your host machine directly
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - shopeasy-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    image: ${DOCKERHUB_USERNAME:-shopeasy}/shopeasy-backend:${IMAGE_TAG:-v4.3}
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shopeasy-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Uncomment for direct host access while debugging
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    image: ${DOCKERHUB_USERNAME:-shopeasy}/shopeasy-frontend:${IMAGE_TAG:-v4.3}
    # host:container
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shopeasy-net

networks:
  shopeasy-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
