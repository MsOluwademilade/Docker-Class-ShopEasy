name: Build, Push & Deploy ShopEasy

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/shopeasy-backend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/shopeasy-backend:latest \
            ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/shopeasy-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/shopeasy-backend:latest

      - name: Build & push frontend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/shopeasy-frontend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/shopeasy-frontend:latest \
            ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/shopeasy-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/shopeasy-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "docker-compose.yml"
          target: "/opt/shopeasy"

      - name: Write .env files & docker compose up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /opt/shopeasy
            mkdir -p backend

            # Root .env - read by docker-compose.yml
            cat > .env <<EOF
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            IMAGE_TAG=${{ github.sha }}
            EOF

            # backend/.env - read by the backend container
            cat > backend/.env <<EOF
            PORT=5000
            NODE_ENV=production
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            DB_HOST=postgres
            DB_PORT=5432
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            EOF

            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
            docker compose pull
            docker compose up -d
            docker image prune -f